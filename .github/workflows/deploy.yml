name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect site files
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/

          for dir in */; do
            dir="${dir%/}"
            case "$dir" in
              .*|_site) continue ;;
            esac
            if [ -f "$dir/index.html" ]; then
              echo "Including app: $dir"
              cp -r "$dir" _site/
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
